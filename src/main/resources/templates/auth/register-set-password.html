<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Thiết Lập Mật Khẩu</title>
    <style>
        nav.navbar, footer { display: none !important; }
        main { min-height: 85vh; display: flex; align-items: center; }
    </style>
</head>
<body>
<div layout:fragment="content" class="py-4 w-100">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="text-center mb-4">
                    <span class="fs-1">🔑</span>
                    <h3 class="fw-bold mt-2">Thiết Lập Mật Khẩu</h3>
                    <div class="badge bg-success-subtle text-success border border-success-subtle px-3 py-1 mb-2">
                        <i class="bi bi-check-circle-fill me-1"></i>Email đã xác thực: <span th:text="${regEmail}">user@example.com</span>
                    </div>
                    <p class="text-muted small">Tạo mật khẩu để hoàn tất đăng ký tài khoản cho <strong th:text="${regFullName}">Khách hàng</strong></p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3 p-3 mb-3 small" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/auth/register/set-password}" th:object="${registerPasswordDto}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mật khẩu mới <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid" placeholder="Tối thiểu 6 ký tự" required autofocus>
                        </div>
                        <div class="invalid-feedback d-block small" th:errors="*{password}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Nhập lại mật khẩu mới <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" th:errorclass="is-invalid" placeholder="Xác nhận mật khẩu" required>
                        </div>
                        <div class="invalid-feedback d-block small" th:errors="*{confirmPassword}"></div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold">
                            <i class="bi bi-person-check-fill me-2"></i>Hoàn Tất & Tạo Tài Khoản
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
