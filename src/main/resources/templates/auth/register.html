<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Đăng Ký Tài Khoản Mới</title>
    <style>
        nav.navbar, footer { display: none !important; }
        main { min-height: 85vh; display: flex; align-items: center; }
    </style>
</head>
<body>
<div layout:fragment="content" class="py-4 w-100">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <span class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.75rem;">
                        <i class="bi bi-person-plus-fill"></i>
                    </span>
                    <h3 class="fw-bold text-dark">Đăng Ký Khách Hàng</h3>
                    <p class="text-muted small">Bước 1: Nhập thông tin để nhận mã OTP xác thực email</p>
                </div>

                <form th:action="@{/auth/register}" th:object="${registerStep1Dto}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{fullName}" class="form-control" th:errorclass="is-invalid" placeholder="Nguyễn Văn A" required autofocus>
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Địa chỉ Email (Nhận OTP) <span class="text-danger">*</span></label>
                        <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" placeholder="name@example.com" required>
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Số điện thoại</label>
                        <input type="text" th:field="*{phoneNumber}" class="form-control" th:errorclass="is-invalid" placeholder="09xxxxxxxx">
                        <div class="invalid-feedback" th:errors="*{phoneNumber}"></div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-xs">
                            <i class="bi bi-arrow-right-circle-fill me-2"></i>Tiếp Tục & Gửi Mã OTP
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">Đã có tài khoản? 
                        <a th:href="@{/auth/login}" class="text-success fw-bold text-decoration-none">Đăng nhập ngay</a>
                    </p>
                </div>

                <div class="text-center mt-3 pt-2">
                    <a th:href="@{/}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Về trang chủ Fruit Store
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
