<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Đăng Ký Tài Khoản Mới</title>
</head>
<body>
<div layout:fragment="content" class="py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="text-center mb-4">
                    <span class="fs-1">🌿</span>
                    <h3 class="fw-bold mt-2">Đăng Ký Khách Hàng</h3>
                    <p class="text-muted small">Tạo tài khoản nhận ngay Voucher CHAOBANMOI giảm 10%</p>
                </div>

                <form th:action="@{/auth/register}" th:object="${registerDto}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{fullName}" class="form-control" th:errorclass="is-invalid" placeholder="Nguyễn Văn A">
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Địa chỉ Email <span class="text-danger">*</span></label>
                        <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" placeholder="name@example.com">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Số điện thoại</label>
                        <input type="text" th:field="*{phoneNumber}" class="form-control" th:errorclass="is-invalid" placeholder="09xxxxxxxx">
                        <div class="invalid-feedback" th:errors="*{phoneNumber}"></div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid" placeholder="Tối thiểu 6 ký tự">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" th:errorclass="is-invalid" placeholder="Xác nhận mật khẩu">
                            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold">
                            <i class="bi bi-person-plus-fill me-2"></i>Tạo Tài Khoản
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">Đã có tài khoản? 
                        <a th:href="@{/auth/login}" class="text-success fw-bold text-decoration-none">Đăng nhập ngay</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
