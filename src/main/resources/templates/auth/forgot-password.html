<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Quên Mật Khẩu</title>
</head>
<body>
<div layout:fragment="content" class="py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="text-center mb-4">
                    <span class="fs-1">🔐</span>
                    <h3 class="fw-bold mt-2">Quên Mật Khẩu</h3>
                    <p class="text-muted small">Nhập email liên kết với tài khoản để nhận mã OTP xác thực</p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/auth/forgot-password}" th:object="${forgotPasswordDto}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Địa chỉ Email đã đăng ký <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" placeholder="name@example.com" required autofocus>
                        </div>
                        <div class="invalid-feedback d-block" th:errors="*{email}"></div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold">
                            <i class="bi bi-send me-2"></i>Gửi Mã OTP
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <a th:href="@{/auth/login}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại trang Đăng nhập
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
