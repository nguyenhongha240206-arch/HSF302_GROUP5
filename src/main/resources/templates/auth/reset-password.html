<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Đặt Lại Mật Khẩu</title>
    <style>
        nav.navbar, footer { display: none !important; }
        main { min-height: 85vh; display: flex; align-items: center; }
    </style>
</head>
<body>
<div layout:fragment="content" class="py-4 w-100">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="text-center mb-4">
                    <span class="fs-1">🔑</span>
                    <h3 class="fw-bold mt-2">Đặt Lại Mật Khẩu Mới</h3>
                    <p class="text-muted small">Nhập mật khẩu mới cho tài khoản: <strong class="text-dark" th:text="${resetPasswordDto.email}">email</strong></p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/auth/reset-password}" th:object="${resetPasswordDto}" method="post">
                    <input type="hidden" th:field="*{email}">
                    <input type="hidden" th:field="*{otpCode}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mật khẩu mới <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" th:field="*{newPassword}" class="form-control" th:errorclass="is-invalid" placeholder="Tối thiểu 6 ký tự" required autofocus>
                        </div>
                        <div class="invalid-feedback d-block" th:errors="*{newPassword}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" th:errorclass="is-invalid" placeholder="Nhập lại mật khẩu mới" required>
                        </div>
                        <div class="invalid-feedback d-block" th:errors="*{confirmPassword}"></div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold">
                            <i class="bi bi-check2-circle me-2"></i>Lưu Mật Khẩu Mới
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <a th:href="@{/auth/login}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Hủy và quay lại trang Đăng nhập
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
