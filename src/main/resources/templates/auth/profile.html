<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Hồ Sơ Cá Nhân</title>
</head>
<body>
<div layout:fragment="content" class="py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="d-flex align-items-center mb-4">
                    <img th:src="${user.avatarUrl != null && !user.avatarUrl.isEmpty() ? user.avatarUrl : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80'}"
                         alt="Avatar" class="rounded-circle me-3 border" width="70" height="70" style="object-fit: cover;">
                    <div>
                        <h4 class="fw-bold mb-1" th:text="${user.fullName}">Tên Người Dùng</h4>
                        <span class="badge bg-success" th:each="r : ${user.roles}" th:text="${r.name} + ' '"></span>
                    </div>
                </div>

                <form th:action="@{/profile/update}" th:object="${profileDto}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email (Không thể thay đổi)</label>
                        <input type="email" th:value="${user.email}" class="form-control bg-light" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{fullName}" class="form-control" th:errorclass="is-invalid" required>
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Số điện thoại</label>
                            <input type="text" th:field="*{phoneNumber}" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ảnh đại diện (URL)</label>
                            <input type="text" th:field="*{avatarUrl}" class="form-control" placeholder="https://...">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Địa chỉ giao hàng mặc định</label>
                        <textarea th:field="*{address}" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                        <a th:href="@{/orders/history}" class="btn btn-outline-secondary rounded-pill px-3">
                            <i class="bi bi-bag-check me-1"></i>Xem Đơn Hàng Của Tôi
                        </a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">
                            <i class="bi bi-save me-1"></i>Lưu Thay Đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
