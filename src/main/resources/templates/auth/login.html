<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Đăng Nhập Tài Khoản</title>
    <style>
        nav.navbar, footer { display: none !important; }
        main { min-height: 85vh; display: flex; align-items: center; }
    </style>
</head>
<body>
<div layout:fragment="content" class="py-4 w-100">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <span class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.75rem;">
                        <i class="bi bi-basket2-fill"></i>
                    </span>
                    <h3 class="fw-bold text-dark">Đăng Nhập</h3>
                    <p class="text-muted small">Chào mừng bạn quay trở lại với Fruit Store</p>
                </div>

                <form th:action="@{/auth/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email hoặc Số điện thoại</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="name@example.com hoặc SĐT" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label fw-semibold mb-0">Mật khẩu</label>
                            <a th:href="@{/auth/forgot-password}" class="small text-muted text-decoration-none">Quên mật khẩu?</a>
                        </div>
                        <div class="input-group mt-1">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
                        </div>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe" style="cursor: pointer;">Ghi nhớ đăng nhập (7 ngày)</label>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-xs">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">Chưa có tài khoản? 
                        <a th:href="@{/auth/register}" class="text-success fw-bold text-decoration-none">Đăng ký ngay</a>
                    </p>
                </div>

                <div class="text-center mt-3 pt-2">
                    <a th:href="@{/}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Về trang chủ Fruit Store
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
