<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>403 - Không Có Quyền Truy Cập</title>
</head>
<body>
<div layout:fragment="content" class="text-center py-5">
    <div class="display-1 text-danger fw-bold"><i class="bi bi-shield-lock-fill"></i> 403</div>
    <h2 class="fw-bold mt-3">Truy Cập Bị Từ Chối</h2>
    <p class="text-muted fs-5">Bạn không có quyền thực hiện thao tác này hoặc truy cập vào khu vực quản trị.</p>
    <div class="mt-4">
        <a th:href="@{/}" class="btn btn-primary rounded-pill px-4">Về Trang Chủ</a>
        <a th:href="@{/auth/login}" class="btn btn-outline-secondary rounded-pill px-4 ms-2">Đăng Nhập Tài Khoản Khác</a>
    </div>
</div>
</body>
</html>
