<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>404 - Không Tìm Thấy Trang</title>
</head>
<body>
<div layout:fragment="content" class="text-center py-5">
    <div class="display-1 text-warning fw-bold"><i class="bi bi-question-circle"></i> 404</div>
    <h2 class="fw-bold mt-3">Không Tìm Thấy Trang Hoặc Tài Nguyên</h2>
    <p class="text-muted fs-5" th:text="${errorMessage != null ? errorMessage : 'Trang bạn đang tìm kiếm không tồn tại hoặc đã bị xóa.'}"></p>
    <div class="mt-4">
        <a th:href="@{/}" class="btn btn-primary rounded-pill px-4">Quay Về Trang Chủ</a>
        <a th:href="@{/catalog}" class="btn btn-outline-success rounded-pill px-4 ms-2">Xem Cửa Hàng Hoa Quả</a>
    </div>
</div>
</body>
</html>
