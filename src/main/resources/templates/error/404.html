<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>404 - Không Tìm Thấy Trang</title>
</head>
<body>
<div layout:fragment="content" class="text-center py-5">
    <div class="card border-0 shadow-sm rounded-4 p-5 mx-auto bg-white" style="max-width: 600px;">
        <div class="brand-icon mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem; background: rgba(245,158,11,0.12); color: #f59e0b;">
            <i class="bi bi-question-circle"></i>
        </div>
        <h1 class="display-5 text-warning fw-bold mb-2">404</h1>
        <h3 class="fw-bold text-dark mb-2">Không Tìm Thấy Trang Hoặc Tài Nguyên</h3>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Trang bạn đang tìm kiếm không tồn tại hoặc đã bị xóa.'}"></p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/}" class="btn btn-success rounded-pill px-4 fw-semibold shadow-sm">Quay Về Trang Chủ</a>
            <a th:href="@{/catalog}" class="btn btn-outline-success rounded-pill px-4">Xem Cửa Hàng Hoa Quả</a>
        </div>
    </div>
</div>
</body>
</html>
