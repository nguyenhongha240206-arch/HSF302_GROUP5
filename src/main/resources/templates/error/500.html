<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>500 - Lỗi Hệ Thống</title>
</head>
<body>
<div layout:fragment="content" class="text-center py-5">
    <div class="card border-0 shadow-sm rounded-4 p-5 mx-auto bg-white" style="max-width: 600px;">
        <div class="brand-icon mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem; background: rgba(220,53,69,0.1); color: #dc3545;">
            <i class="bi bi-exclamation-octagon"></i>
        </div>
        <h1 class="display-5 text-danger fw-bold mb-2">500</h1>
        <h3 class="fw-bold text-dark mb-2">Đã Xảy Ra Lỗi Hệ Thống</h3>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Hệ thống đang gặp sự cố tạm thời. Vui lòng thử lại sau.'}"></p>
        <div class="d-flex justify-content-center">
            <a th:href="@{/}" class="btn btn-success rounded-pill px-4 fw-semibold shadow-sm">Quay Về Trang Chủ</a>
        </div>
    </div>
</div>
</body>
</html>
