<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>Quản Lý Danh Mục Hoa Quả</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1 text-dark">Danh Mục Hoa Quả</h3>
            <p class="text-muted small mb-0">Quản lý các nhóm hoa quả nhập khẩu, nội địa, giỏ quà...</p>
        </div>
        <a th:href="@{/admin/categories/new}" class="btn btn-success rounded-pill px-4 fw-semibold shadow-sm">
            <i class="bi bi-plus-lg me-1"></i>Thêm Danh Mục
        </a>
    </div>

    <!-- Search box -->
    <div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
        <form th:action="@{/admin/categories}" method="get" class="row g-2 align-items-center">
            <div class="col-md-5">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên hoặc mã danh mục...">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-success rounded-pill px-4 fw-semibold">Tìm Kiếm</button>
                <a th:href="@{/admin/categories}" class="btn btn-outline-secondary rounded-pill px-3">Làm Mới</a>
            </div>
        </form>
    </div>

    <!-- Table -->
    <div class="admin-table-card p-4">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th style="width: 80px;">Hình Ảnh</th>
                        <th>Tên Danh Mục</th>
                        <th>Mã Code</th>
                        <th>Thứ Tự</th>
                        <th>Trạng Thái</th>
                        <th class="text-end" style="width: 150px;">Thao Tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${categoryPage.empty}">
                        <td colspan="6" class="text-center py-4 text-muted">Chưa có danh mục nào</td>
                    </tr>
                    <tr th:each="c : ${categoryPage.content}">
                        <td>
                            <img th:src="${c.imageUrl != null ? c.imageUrl : 'https://images.unsplash.com/photo-1550258987-190a2d41a8ba?auto=format&fit=crop&w=100&q=80'}"
                                 class="rounded-3" width="50" height="50" style="object-fit: cover;">
                        </td>
                        <td>
                            <span class="fw-bold text-dark" th:text="${c.name}">Tên danh mục</span>
                            <div class="small text-muted" th:text="${c.description}">Mô tả</div>
                        </td>
                        <td><span class="badge bg-light text-dark font-monospace border" th:text="${c.code}">CODE</span></td>
                        <td th:text="${c.displayOrder}">1</td>
                        <td>
                            <span th:if="${c.active}" class="badge bg-success">Hoạt động</span>
                            <span th:unless="${c.active}" class="badge bg-secondary">Tạm ẩn</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/admin/categories/edit/{id}(id=${c.id})}" class="btn btn-outline-success btn-sm rounded-pill me-1" title="Chỉnh sửa">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <form th:action="@{/admin/categories/delete/{id}(id=${c.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa danh mục này? (Dữ liệu sẽ chuyển sang Soft Delete)');">
                                <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill" title="Xóa">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:if="${categoryPage.totalPages > 1}" class="d-flex justify-content-center mt-4">
            <ul class="pagination pagination-sm">
                <li class="page-item" th:classappend="${categoryPage.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/categories(page=${categoryPage.number - 1}, keyword=${keyword})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, categoryPage.totalPages - 1)}"
                    th:classappend="${i == categoryPage.number} ? 'active'">
                    <a class="page-link" th:href="@{/admin/categories(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${categoryPage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/categories(page=${categoryPage.number + 1}, keyword=${keyword})}">Sau</a>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
