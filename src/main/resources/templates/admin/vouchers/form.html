<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title th:text="${voucherDto.id == null ? 'Thêm Voucher Mới' : 'Cập Nhật Voucher'}">Quản Lý Voucher</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <h4 class="fw-bold mb-0 text-dark" th:text="${voucherDto.id == null ? 'Thêm Mã Voucher Mới' : 'Cập Nhật Voucher'}"></h4>
                    <a th:href="@{/admin/vouchers}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
                    </a>
                </div>

                <form th:action="@{/admin/vouchers/save}" th:object="${voucherDto}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Mã Voucher (Code) <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{code}" class="form-control text-uppercase font-monospace" th:errorclass="is-invalid" placeholder="CHAOBANMOI">
                            <div class="invalid-feedback" th:errors="*{code}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Tên Chương Trình <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid" placeholder="Ưu đãi tri ân khách hàng">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Mức Giảm (%) <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{discountPercent}" min="1" max="100" class="form-control" th:errorclass="is-invalid" placeholder="10">
                            <div class="invalid-feedback" th:errors="*{discountPercent}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Giảm Tối Đa (VNĐ)</label>
                            <input type="number" th:field="*{maxDiscountAmount}" class="form-control" placeholder="100000">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Đơn Hàng Tối Thiểu (VNĐ)</label>
                            <input type="number" th:field="*{minOrderAmount}" class="form-control" placeholder="200000">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Ngày Bắt Đầu <span class="text-danger">*</span></label>
                            <input type="date" th:field="*{startDate}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{startDate}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Ngày Kết Thúc <span class="text-danger">*</span></label>
                            <input type="date" th:field="*{endDate}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{endDate}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Giới Hạn Lượt Dùng <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{usageLimit}" min="1" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{usageLimit}"></div>
                        </div>
                    </div>

                    <div class="mb-4 pt-2">
                        <div class="form-check form-switch fs-5">
                            <input class="form-check-input" type="checkbox" th:field="*{active}" id="voucherActiveSwitch">
                            <label class="form-check-label fs-6 fw-semibold" for="voucherActiveSwitch">Kích hoạt mã voucher</label>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 border-top pt-3">
                        <a th:href="@{/admin/vouchers}" class="btn btn-outline-secondary rounded-pill px-4">Hủy</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Lưu Voucher</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
