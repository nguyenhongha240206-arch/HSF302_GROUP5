<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>Quản Lý Voucher Giảm Giá</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1 text-dark">Voucher Khuyến Mãi</h3>
            <p class="text-muted small mb-0">Quản lý mã giảm giá, mức giảm, thời hạn và số lượt sử dụng</p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <form th:action="@{/admin/vouchers/scan-expired}" method="post" class="d-inline m-0">
                <button type="submit" class="btn btn-outline-warning rounded-pill px-3 shadow-xs"
                        title="Tự động quét và vô hiệu hóa các voucher có endDate chạm mốc hiện tại hoặc hết lượt dùng">
                    <i class="bi bi-clock-history me-1"></i>Quét Voucher Hết Hạn
                </button>
            </form>
            <a th:href="@{/admin/vouchers/new}" class="btn btn-success rounded-pill px-4 shadow-sm fw-semibold">
                <i class="bi bi-plus-lg me-1"></i>Thêm Voucher
            </a>
        </div>
    </div>

    <!-- Search box -->
    <div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
        <form th:action="@{/admin/vouchers}" method="get" class="row g-2 align-items-center">
            <div class="col-md-5">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo mã hoặc tên voucher...">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-success rounded-pill px-4 fw-semibold">Tìm Kiếm</button>
                <a th:href="@{/admin/vouchers}" class="btn btn-outline-secondary rounded-pill px-3">Làm Mới</a>
            </div>
        </form>
    </div>

    <!-- Vouchers Table Card -->
    <div class="admin-table-card p-4">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Mã Voucher</th>
                        <th>Chương Trình</th>
                        <th>Giảm Giá</th>
                        <th>Đơn Tối Thiểu</th>
                        <th>Thời Hạn Áp Dụng</th>
                        <th>Lượt Dùng</th>
                        <th>Trạng Thái</th>
                        <th class="text-end" style="width: 140px;">Thao Tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${voucherPage.empty}">
                        <td colspan="8" class="text-center py-4 text-muted">Chưa có voucher nào</td>
                    </tr>
                    <tr th:each="v : ${voucherPage.content}">
                        <td><span class="badge bg-success font-monospace fs-6 px-2 py-1" th:text="${v.code}">CODE</span></td>
                        <td class="fw-bold text-dark" th:text="${v.name}">Tên chương trình</td>
                        <td>
                            <span class="badge bg-danger fs-6" th:text="'-' + ${v.discountPercent} + '%'">-10%</span>
                            <div class="small text-muted" th:if="${v.maxDiscountAmount != null}" th:text="'Tối đa ' + ${#numbers.formatDecimal(v.maxDiscountAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                        </td>
                        <td th:text="${v.minOrderAmount != null ? #numbers.formatDecimal(v.minOrderAmount, 0, 'COMMA', 0, 'POINT') + ' đ' : '0 đ'}">200,000 đ</td>
                        <td>
                            <div class="small text-dark" th:text="${#temporals.format(v.startDate, 'dd/MM/yyyy')} + ' -> ' + ${#temporals.format(v.endDate, 'dd/MM/yyyy')}"></div>
                        </td>
                        <td>
                            <span class="fw-bold" th:text="${v.usedCount} + ' / ' + ${v.usageLimit}">10 / 100</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/vouchers/{id}/toggle(id=${v.id})}" method="post" class="d-inline m-0">
                                <button type="submit" class="btn btn-sm rounded-pill d-inline-flex align-items-center gap-1 border"
                                        th:classappend="${v.active} ? 'btn-success text-white' : 'btn-light text-muted'"
                                        th:title="${v.active} ? 'Nhấp để tạm khóa voucher' : 'Nhấp để kích hoạt voucher'">
                                    <i class="bi" th:classappend="${v.active} ? 'bi-toggle-on text-white fs-6' : 'bi-toggle-off text-muted fs-6'"></i>
                                    <span class="fw-semibold small" th:text="${v.active} ? 'Đang hoạt động' : 'Tạm khóa'">Đang hoạt động</span>
                                </button>
                            </form>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/admin/vouchers/edit/{id}(id=${v.id})}" class="btn btn-outline-success btn-sm rounded-pill me-1" title="Chỉnh sửa">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <form th:action="@{/admin/vouchers/delete/{id}(id=${v.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Bạn có chắc muốn xóa voucher này? (Soft Delete)');">
                                <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:if="${voucherPage.totalPages > 1}" class="d-flex justify-content-center mt-4">
            <ul class="pagination pagination-sm">
                <li class="page-item" th:classappend="${voucherPage.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/vouchers(page=${voucherPage.number - 1}, keyword=${keyword})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, voucherPage.totalPages - 1)}"
                    th:classappend="${i == voucherPage.number} ? 'active'">
                    <a class="page-link" th:href="@{/admin/vouchers(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${voucherPage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/vouchers(page=${voucherPage.number + 1}, keyword=${keyword})}">Sau</a>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
