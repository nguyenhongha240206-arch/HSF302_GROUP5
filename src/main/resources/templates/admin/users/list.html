<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>Quản Lý Người Dùng & Phân Quyền</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1 text-dark">Quản Lý Người Dùng & Phân Quyền</h3>
            <p class="text-muted small mb-0">Danh sách tài khoản khách hàng, nhân viên và quản trị viên</p>
        </div>
    </div>

    <!-- Search box -->
    <div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
        <form th:action="@{/admin/users}" method="get" class="row g-2 align-items-center">
            <div class="col-md-5">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên hoặc email...">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-dark rounded-pill px-3">Tìm Kiếm</button>
                <a th:href="@{/admin/users}" class="btn btn-outline-secondary rounded-pill px-3">Làm Mới</a>
            </div>
        </form>
    </div>

    <!-- Table -->
    <div class="admin-table-card p-4">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th style="width: 60px;">Ảnh</th>
                        <th>Họ Và Tên</th>
                        <th>Email</th>
                        <th>Số Điện Thoại</th>
                        <th>Vai Trò (Roles)</th>
                        <th>Trạng Thái</th>
                        <th class="text-end" style="width: 180px;">Thao Tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${usersPage.empty}">
                        <td colspan="7" class="text-center py-4 text-muted">Không tìm thấy người dùng nào</td>
                    </tr>
                    <tr th:each="u : ${usersPage.content}">
                        <td>
                            <img th:src="${u.avatarUrl != null && !u.avatarUrl.isEmpty() ? u.avatarUrl : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80'}"
                                 class="rounded-circle" width="40" height="40" style="object-fit: cover;">
                        </td>
                        <td>
                            <span class="fw-bold text-dark" th:text="${u.fullName}">Nguyễn Văn A</span>
                            <div class="small text-muted" th:text="${u.address != null ? u.address : 'Chưa cập nhật địa chỉ'}"></div>
                        </td>
                        <td th:text="${u.email}">user@example.com</td>
                        <td th:text="${u.phoneNumber != null ? u.phoneNumber : '-'}">09xxxxxxxx</td>
                        <td>
                            <span th:each="r : ${u.roles}" class="badge bg-primary me-1" th:text="${r.name}">ROLE_CUSTOMER</span>
                        </td>
                        <td>
                            <span th:if="${u.enabled}" class="badge bg-success">Hoạt động</span>
                            <span th:unless="${u.enabled}" class="badge bg-danger">Bị khóa</span>
                        </td>
                        <td class="text-end">
                            <form th:action="@{/admin/users/{id}/toggle-status(id=${u.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-warning btn-sm rounded-pill me-1"
                                        th:title="${u.enabled ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}">
                                    <i th:class="${u.enabled ? 'bi bi-lock' : 'bi bi-unlock'}"></i>
                                </button>
                            </form>
                            <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa người dùng này? (Soft Delete)');">
                                <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill" title="Xóa">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:if="${usersPage.totalPages > 1}" class="d-flex justify-content-center mt-4">
            <ul class="pagination pagination-sm">
                <li class="page-item" th:classappend="${usersPage.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/users(page=${usersPage.number - 1}, keyword=${keyword})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, usersPage.totalPages - 1)}"
                    th:classappend="${i == usersPage.number} ? 'active'">
                    <a class="page-link" th:href="@{/admin/users(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${usersPage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/users(page=${usersPage.number + 1}, keyword=${keyword})}">Sau</a>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
