<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Thanh Toán Đơn Hàng</title>
</head>
<body>
<div layout:fragment="content" class="py-2">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-success text-decoration-none">Trang chủ</a></li>
            <li class="breadcrumb-item"><a th:href="@{/cart}" class="text-success text-decoration-none">Giỏ hàng</a></li>
            <li class="breadcrumb-item active" aria-current="page">Thanh toán</li>
        </ol>
    </nav>

    <h3 class="fw-bold mb-4 text-dark"><i class="bi bi-shield-check text-success me-2"></i>Thông Tin Đặt Hàng & Thanh Toán</h3>

    <form th:action="@{/checkout}" th:object="${checkoutDto}" method="post">
        <div class="row g-4">
            <!-- Left: Shipping info & payment method -->
            <div class="col-lg-7">
                <!-- Shipping Info Card -->
                <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                    <h5 class="fw-bold mb-3"><i class="bi bi-geo-alt-fill text-danger me-2"></i>1. Địa Chỉ Nhận Hàng</h5>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Họ và tên người nhận <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{receiverName}" class="form-control" th:errorclass="is-invalid" placeholder="Nguyễn Văn A" required>
                        <div class="invalid-feedback" th:errors="*{receiverName}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Số điện thoại liên hệ <span class="text-danger">*</span></label>
                        <input type="tel" th:field="*{receiverPhone}" class="form-control" th:errorclass="is-invalid" placeholder="09xxxxxxxx" required>
                        <div class="invalid-feedback" th:errors="*{receiverPhone}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Địa chỉ giao hàng chi tiết <span class="text-danger">*</span></label>
                        <textarea th:field="*{shippingAddress}" class="form-control" th:errorclass="is-invalid" rows="2" placeholder="Số nhà, tên đường, phường/xã, quận/huyện..." required></textarea>
                        <div class="invalid-feedback" th:errors="*{shippingAddress}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Ghi chú giao hàng (Tùy chọn)</label>
                        <input type="text" th:field="*{note}" class="form-control" placeholder="Ghi chú thiệp chúc mừng, giờ nhận hàng...">
                    </div>
                </div>

                <!-- Payment Method Card -->
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h5 class="fw-bold mb-3"><i class="bi bi-credit-card-2-front-fill text-primary me-2"></i>2. Phương Thức Thanh Toán</h5>

                    <div class="form-check p-3 border rounded-3 mb-3">
                        <input class="form-check-input ms-0 me-3" type="radio" th:field="*{paymentMethod}" id="payCOD" value="COD" checked>
                        <label class="form-check-label fw-semibold" for="payCOD">
                            <i class="bi bi-cash-stack text-success me-2 fs-5"></i>Thanh toán khi nhận hàng (COD)
                            <div class="small text-muted fw-normal">Bạn kiểm tra hoa quả tươi ngon, giỏ quà nguyên vẹn trước khi thanh toán tiền mặt cho shipper.</div>
                        </label>
                    </div>

                    <div class="form-check p-3 border rounded-3">
                        <input class="form-check-input ms-0 me-3" type="radio" th:field="*{paymentMethod}" id="payBank" value="BANK_TRANSFER">
                        <label class="form-check-label fw-semibold" for="payBank">
                            <i class="bi bi-qr-code-scan text-primary me-2 fs-5"></i>Chuyển khoản Ngân hàng (QR Code / Banking)
                            <div class="small text-muted fw-normal">Chuyển khoản nhanh qua mã QR tự động. Đơn hàng được ưu tiên xử lý đóng gói và giao siêu tốc.</div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Right: Order items summary & confirm button -->
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 100px;">
                    <h5 class="fw-bold mb-3">Đơn Hàng Của Bạn (<span th:text="${cart.totalQuantity}">0</span> sản phẩm)</h5>

                    <!-- Items mini list -->
                    <div class="overflow-auto mb-3" style="max-height: 250px;">
                        <div class="d-flex align-items-center mb-3 pb-2 border-bottom" th:each="i : ${cart.items}">
                            <img th:src="${i.imageUrl != null ? i.imageUrl : 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=100&q=80'}"
                                 class="rounded-3 me-3" width="50" height="50" style="object-fit: cover;">
                            <div class="flex-grow-1">
                                <h6 class="mb-0 small fw-bold" th:text="${i.productName}">Tên sản phẩm</h6>
                                <div class="small text-muted" th:text="${#numbers.formatDecimal(i.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' đ x ' + ${i.quantity}"></div>
                            </div>
                            <div class="small fw-bold text-end text-dark" th:text="${#numbers.formatDecimal(i.subTotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                        </div>
                    </div>

                    <!-- Price calculation -->
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Tổng tiền hàng:</span>
                        <span class="fw-semibold" th:text="${#numbers.formatDecimal(cart.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                    </div>

                    <div class="d-flex justify-content-between mb-2" th:if="${cart.discountAmount > 0}">
                        <span class="text-success">Giảm giá voucher (<span th:text="${cart.voucherCode}"></span>):</span>
                        <span class="fw-semibold text-success" th:text="'-' + ${#numbers.formatDecimal(cart.discountAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">-0 đ</span>
                    </div>

                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Phí giao hàng:</span>
                        <span class="text-success fw-semibold">Miễn phí</span>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span class="h5 fw-bold mb-0">Tổng Thanh Toán:</span>
                        <span class="h3 fw-bold text-danger mb-0" th:text="${#numbers.formatDecimal(cart.finalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold shadow-sm">
                            <i class="bi bi-check-circle-fill me-2"></i>Xác Nhận Đặt Hàng
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
