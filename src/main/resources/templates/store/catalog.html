<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Cửa Hàng Hoa Quả - Danh Sách Sản Phẩm</title>
    <style>
        .product-img-wrapper { position: relative; }
        .wishlist-btn-wrapper { position: absolute; top: 8px; right: 8px; z-index: 10; text-decoration: none; }
        .wishlist-btn { background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.15); transition: transform 0.15s; padding: 0; }
        .wishlist-btn:hover { transform: scale(1.15); background: white; }
    </style>
</head>
<body>
<div layout:fragment="content" class="py-2">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-success text-decoration-none">Trang chủ</a></li>
            <li class="breadcrumb-item active" aria-current="page">Cửa hàng hoa quả</li>
        </ol>
    </nav>

    <div class="row g-4">
        <!-- Sidebar Filter -->
        <div class="col-lg-3">
            <div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
                <h5 class="fw-bold mb-3 text-dark"><i class="bi bi-funnel-fill text-success me-2"></i>Bộ Lọc Sản Phẩm</h5>

                <form th:action="@{/catalog}" method="get">
                    <!-- Keyword input -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Từ khóa tìm kiếm</label>
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="Nhập tên hoa quả...">
                    </div>

                    <!-- Origin filter -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Xuất xứ</label>
                        <select name="origin" class="form-select form-select-sm">
                            <option value="">-- Tất cả xuất xứ --</option>
                            <option th:each="o : ${origins}" th:value="${o}" th:text="${o}" th:selected="${o == origin}"></option>
                        </select>
                    </div>

                    <!-- Category filter -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Danh mục</label>
                        <select name="categoryId" class="form-select form-select-sm">
                            <option value="">-- Tất cả danh mục --</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == selectedCategoryId}"></option>
                        </select>
                    </div>

                    <!-- Product Type filter -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Loại sản phẩm</label>
                        <select name="productType" class="form-select form-select-sm">
                            <option value="">-- Tất cả loại --</option>
                            <option value="FRUIT" th:selected="${selectedProductType?.name() == 'FRUIT'}">Trái cây tươi</option>
                            <option value="GIFT_BASKET" th:selected="${selectedProductType?.name() == 'GIFT_BASKET'}">Giỏ quà trái cây</option>
                            <option value="DRIED_FRUIT" th:selected="${selectedProductType?.name() == 'DRIED_FRUIT'}">Trái cây sấy khô</option>
                        </select>
                    </div>

                    <!-- Price Range -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Khoảng giá (VNĐ)</label>
                        <div class="row g-2">
                            <div class="col-6">
                                <input type="number" name="minPrice" th:value="${minPrice}" class="form-control form-control-sm" placeholder="Từ">
                            </div>
                            <div class="col-6">
                                <input type="number" name="maxPrice" th:value="${maxPrice}" class="form-control form-control-sm" placeholder="Đến">
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-sm rounded-pill">
                            <i class="bi bi-search me-1"></i>Áp Dụng Lọc
                        </button>
                        <a th:href="@{/catalog}" class="btn btn-outline-secondary btn-sm rounded-pill">Đặt Lại</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Product List & Sorting -->
        <div class="col-lg-9">
            <!-- Top Controls -->
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 p-3 bg-white rounded-4 shadow-sm">
                <div class="small text-muted mb-2 mb-md-0">
                    Hiển thị <span class="fw-bold text-dark" th:text="${productsPage.totalElements}">0</span> sản phẩm
                </div>

                <div class="d-flex align-items-center gap-2">
                    <span class="small text-muted text-nowrap">Sắp xếp:</span>
                    <form th:action="@{/catalog}" method="get" class="d-flex gap-2">
                        <input type="hidden" name="keyword" th:value="${keyword}">
                        <input type="hidden" name="origin" th:value="${origin}">
                        <input type="hidden" name="categoryId" th:value="${selectedCategoryId}">
                        <input type="hidden" name="productType" th:value="${selectedProductType}">
                        <input type="hidden" name="minPrice" th:value="${minPrice}">
                        <input type="hidden" name="maxPrice" th:value="${maxPrice}">

                        <select name="sortBy" class="form-select form-select-sm" onchange="this.form.submit()">
                            <option value="createdAt" th:selected="${sortBy == 'createdAt'}">Mới nhất</option>
                            <option value="price" th:selected="${sortBy == 'price'}">Giá bán</option>
                            <option value="name" th:selected="${sortBy == 'name'}">Tên A-Z</option>
                        </select>
                        <select name="direction" class="form-select form-select-sm" onchange="this.form.submit()">
                            <option value="DESC" th:selected="${direction == 'DESC'}">Giảm dần</option>
                            <option value="ASC" th:selected="${direction == 'ASC'}">Tăng dần</option>
                        </select>
                    </form>
                </div>
            </div>

            <!-- Products Grid -->
            <div th:if="${productsPage.empty}" class="text-center py-5 bg-white rounded-4 shadow-sm">
                <i class="bi bi-emoji-neutral fs-1 text-muted"></i>
                <h5 class="fw-bold mt-2">Không tìm thấy sản phẩm phù hợp</h5>
                <p class="text-muted small">Hãy thử tìm với từ khóa khác hoặc xóa bộ lọc.</p>
                <a th:href="@{/catalog}" class="btn btn-outline-success btn-sm rounded-pill mt-2">Xem Tất Cả Sản Phẩm</a>
            </div>

            <div class="row g-4" th:unless="${productsPage.empty}">
                <div class="col-6 col-md-4" th:each="p : ${productsPage.content}">
                    <div class="product-card">
                        <div class="product-img-wrapper">
                            <span class="badge-origin" th:text="${p.origin}">Xuất xứ</span>
                            <span th:if="${p.featured}" class="badge-featured">Hot</span>
                            <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=600&q=80'}" th:alt="${p.name}">
                            <!-- Wishlist toggle button -->
                            <form th:action="@{/wishlist/toggle/{id}(id=${p.id})}" method="post" class="wishlist-btn-wrapper" sec:authorize="isAuthenticated()">
                                <input type="hidden" name="redirectUrl" value="/catalog">
                                <button type="submit" class="wishlist-btn" th:title="${wishlistedIds != null and wishlistedIds.contains(p.id)} ? 'Xóa yêu thích' : 'Thêm yêu thích'">
                                    <i class="bi" th:classappend="${wishlistedIds != null and wishlistedIds.contains(p.id)} ? 'bi-heart-fill text-danger' : 'bi-heart text-muted'"></i>
                                </button>
                            </form>
                            <a th:href="@{/auth/login}" class="wishlist-btn-wrapper" sec:authorize="isAnonymous()">
                                <span class="wishlist-btn" title="Đăng nhập để thêm yêu thích">
                                    <i class="bi bi-heart text-muted"></i>
                                </span>
                            </a>
                        </div>
                        <div class="product-body">
                            <a th:href="@{/products/{id}(id=${p.id})}" class="product-title" th:text="${p.name}">Tên Sản Phẩm</a>
                            <div class="small text-muted mb-2">ĐVT: <span th:text="${p.unit}">kg</span> | Kho: <span th:text="${p.stockQuantity}">10</span></div>
                            <div class="mt-auto">
                                <div class="d-flex align-items-baseline mb-3">
                                    <span class="product-price" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">100,000 đ</span>
                                    <span th:if="${p.originalPrice != null && p.originalPrice > p.price}"
                                          class="product-old-price" th:text="${#numbers.formatDecimal(p.originalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">120,000 đ</span>
                                </div>
                                <form th:action="@{/cart/add}" method="post">
                                    <input type="hidden" name="productId" th:value="${p.id}">
                                    <input type="hidden" name="quantity" value="1">
                                    <button type="submit" class="btn btn-primary w-100 rounded-pill btn-sm py-2" th:disabled="${p.stockQuantity <= 0}">
                                        <i class="bi bi-cart-plus me-1"></i> <span th:text="${p.stockQuantity > 0 ? 'Thêm Vào Giỏ' : 'Hết Hàng'}"></span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div th:if="${productsPage.totalPages > 1}" class="d-flex justify-content-center mt-5">
                <nav>
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${productsPage.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/catalog(page=${productsPage.number - 1}, keyword=${keyword}, origin=${origin}, categoryId=${selectedCategoryId}, productType=${selectedProductType}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy=${sortBy}, direction=${direction})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, productsPage.totalPages - 1)}"
                            th:classappend="${i == productsPage.number} ? 'active'">
                            <a class="page-link" th:href="@{/catalog(page=${i}, keyword=${keyword}, origin=${origin}, categoryId=${selectedCategoryId}, productType=${selectedProductType}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy=${sortBy}, direction=${direction})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${productsPage.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/catalog(page=${productsPage.number + 1}, keyword=${keyword}, origin=${origin}, categoryId=${selectedCategoryId}, productType=${selectedProductType}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy=${sortBy}, direction=${direction})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
</body>
</html>
