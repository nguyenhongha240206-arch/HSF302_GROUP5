<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>My Reviews</title>
</head>
<body>
<div layout:fragment="content" class="py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-chat-heart text-danger me-2"></i>My Reviews</h2>
            <p class="text-muted mb-0">Reviews and product feedback you have submitted.</p>
        </div>
        <a th:href="@{/profile}" class="btn btn-outline-secondary rounded-pill px-4">Back to profile</a>
    </div>

    <div th:if="${#lists.isEmpty(reviews)}" class="empty-state card border-0 shadow-sm rounded-4 p-5 text-center bg-white">
        <div class="empty-state-icon mx-auto mb-3">
            <i class="bi bi-chat-square-text text-muted"></i>
        </div>
        <h5 class="fw-bold mt-2 text-dark">You have not submitted any reviews yet</h5>
        <p class="text-muted small">Reviews you leave on products will appear here.</p>
        <a th:href="@{/catalog}" class="btn btn-success rounded-pill px-4 mx-auto fw-semibold shadow-sm">Browse products</a>
    </div>

    <div th:unless="${#lists.isEmpty(reviews)}" class="d-flex flex-column gap-3">
        <article th:each="review : ${reviews}" class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
                <div>
                    <a th:href="@{/products/{id}(id=${review.product.id})}"
                       class="h5 fw-bold text-dark text-decoration-none"
                       th:text="${review.product.name}">Product</a>
                    <div class="text-warning d-flex align-items-center gap-1 mt-1" aria-label="Rating">
                        <i th:each="star : ${#numbers.sequence(1, review.rating)}" class="bi bi-star-fill"></i>
                        <span class="text-muted small ms-2" th:text="${review.rating} + ' / 5'"></span>
                    </div>
                </div>
                <time class="text-muted small"
                      th:if="${review.createdAt != null}"
                      th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}">Date</time>
            </div>
            <p class="mb-2 text-secondary" style="white-space: pre-line" th:text="${review.comment}">Your feedback</p>
            <img th:if="${review.imageUrl != null and !review.imageUrl.isBlank()}"
                 th:src="@{${review.imageUrl}}" alt="Feedback attachment"
                 class="img-thumbnail align-self-start" style="max-height: 220px; max-width: 100%;">
        </article>
    </div>
</div>
</body>
</html>
