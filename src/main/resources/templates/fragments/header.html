<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-custom sticky-top py-2">
    <div class="container">
        <!-- Brand Logo with Vector Icon -->
        <a class="navbar-brand" th:href="@{/}">
            <span class="brand-icon">
                <i class="bi bi-basket2-fill"></i>
            </span>
            <span>FRUIT<span class="text-warning">STORE</span></span>
        </a>

        <!-- Mobile Toggler -->
        <button class="navbar-toggler border-0 p-2 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <!-- Nav Menu -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/catalog}">Cửa hàng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-danger fw-semibold" th:href="@{/custom-basket}">
                        <i class="bi bi-gift me-1"></i>Tự Tạo Giỏ Quà
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/catalog(productType='GIFT_BASKET')}">Giỏ quà mẫu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning-emphasis fw-semibold" th:href="@{/promotions}">
                        <i class="bi bi-ticket-perforated me-1 text-warning"></i>Khuyến Mãi
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}">Giới thiệu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/contact}">Liên hệ</a>
                </li>
            </ul>

            <!-- Search box -->
            <form class="d-flex me-lg-3 my-2 my-lg-0" th:action="@{/catalog}" method="get">
                <div class="input-group search-input-group">
                    <input class="form-control form-control-sm border-0" 
                           type="search" name="keyword" placeholder="Tìm hoa quả, giỏ quà..." aria-label="Search">
                    <button class="btn btn-sm" type="submit" aria-label="Submit search">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>

            <!-- Actions (Cart & Auth) -->
            <div class="d-flex align-items-center gap-2">
                <!-- Cart (Icon-only) -->
                <a th:href="@{/cart}" 
                   class="position-relative me-1" 
                   id="cartNavButton" 
                   title="Xem giỏ hàng"
                   aria-label="Giỏ hàng">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span id="cartBadge" 
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow-sm"
                          th:text="${session.SHOPPING_CART != null ? session.SHOPPING_CART.totalQuantity : 0}"
                          th:style="${session.SHOPPING_CART != null && session.SHOPPING_CART.totalQuantity > 0} ? '' : 'display: none;'">
                        0
                    </span>
                </a>

                <!-- Auth Buttons for Guests -->
                <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                    <a th:href="@{/auth/login}" class="btn btn-outline-primary btn-sm px-3">Đăng nhập</a>
                    <a th:href="@{/auth/register}" class="btn btn-primary btn-sm px-3">Đăng ký</a>
                </div>

                <!-- User Dropdown (Authenticated) -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="btn btn-light btn-sm dropdown-toggle d-flex align-items-center py-1 px-3 border shadow-none" 
                            type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle fs-5 me-2 text-success"></i>
                        <span sec:authentication="name" class="fw-semibold">Tài khoản</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-3 mt-2" aria-labelledby="userMenu">
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item text-danger fw-semibold py-2" th:href="@{/admin}">
                                <i class="bi bi-shop me-2"></i>Kênh Quản Trị Shop
                            </a>
                        </li>
                        <li sec:authorize="hasRole('ADMIN')"><hr class="dropdown-divider my-1"></li>
                        <li>
                            <a class="dropdown-item py-2" th:href="@{/profile}">
                                <i class="bi bi-person me-2 text-muted"></i>Thông tin cá nhân
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item py-2" th:href="@{/orders/history}">
                                <i class="bi bi-bag-check me-2 text-muted"></i>Lịch sử đơn hàng
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item py-2" th:href="@{/account/vouchers}">
                                <i class="bi bi-wallet2 me-2 text-success"></i>Ví Voucher của tôi
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item py-2" th:href="@{/reviews/mine}">
                                <i class="bi bi-chat-heart me-2 text-muted"></i>Đánh giá của tôi
                            </a>
                        </li>
                        <li><hr class="dropdown-divider my-1"></li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post" class="m-0 p-0">
                                <button type="submit" class="dropdown-item text-danger py-2">
                                    <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
