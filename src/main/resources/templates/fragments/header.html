<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3">
    <div class="container">
        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <span class="fs-3 me-2">🍎</span>
            <span class="fw-bold tracking-tight">FRUIT<span class="text-warning">STORE</span></span>
        </a>

        <!-- Mobile Toggler -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <!-- Nav Menu -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/catalog}">Cửa hàng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-danger fw-bold" th:href="@{/custom-basket}">
                        <i class="bi bi-gift-fill me-1"></i>Tự Tạo Giỏ Quà
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/catalog(productType='GIFT_BASKET')}">Giỏ quà mẫu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}">Giới thiệu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/contact}">Liên hệ</a>
                </li>
            </ul>

            <!-- Search box -->
            <form class="d-flex me-3" th:action="@{/catalog}" method="get">
                <div class="input-group">
                    <input class="form-control form-control-sm border-end-0 rounded-start-pill ps-3" 
                           type="search" name="keyword" placeholder="Tìm hoa quả, giỏ quà..." aria-label="Search">
                    <button class="btn btn-outline-secondary btn-sm border-start-0 rounded-end-pill pe-3 bg-transparent" type="submit">
                        <i class="bi bi-search text-muted"></i>
                    </button>
                </div>
            </form>

            <!-- Actions (Cart & Auth) -->
            <div class="d-flex align-items-center gap-2">
                <!-- Cart -->
                <a th:href="@{/cart}" class="btn btn-outline-success position-relative rounded-pill px-3 py-1" id="cartNavButton" title="Xem giỏ hàng">
                    <i class="bi bi-cart3 fs-5 align-middle"></i>
                    <span class="ms-1 d-none d-md-inline font-weight-bold">Giỏ hàng</span>
                    <span id="cartBadge" 
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow-sm"
                          th:text="${session.SHOPPING_CART != null ? session.SHOPPING_CART.totalQuantity : 0}"
                          th:style="${session.SHOPPING_CART != null && session.SHOPPING_CART.totalQuantity > 0} ? '' : 'display: none;'">
                        0
                    </span>
                </a>

                <!-- Auth Buttons -->
                <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                    <a th:href="@{/auth/login}" class="btn btn-outline-primary btn-sm rounded-pill px-3">Đăng nhập</a>
                    <a th:href="@{/auth/register}" class="btn btn-primary btn-sm rounded-pill px-3">Đăng ký</a>
                </div>

                <!-- User Dropdown (Authenticated) -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="btn btn-light dropdown-toggle rounded-pill d-flex align-items-center py-1 px-3 border" 
                            type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle fs-5 me-2 text-success"></i>
                        <span sec:authentication="name" class="fw-semibold">Tài khoản</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userMenu">
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item text-danger fw-bold" th:href="@{/admin}">
                                <i class="bi bi-shop me-2"></i>Kênh Quản Trị Shop
                            </a>
                        </li>
                        <li sec:authorize="hasRole('ADMIN')"><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item" th:href="@{/profile}">
                                <i class="bi bi-person me-2"></i>Thông tin cá nhân
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/orders/history}">
                                <i class="bi bi-bag-check me-2"></i>Lịch sử đơn hàng
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/reviews/mine}">
                                <i class="bi bi-chat-heart me-2"></i>My reviews
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post" class="m-0 p-0">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
