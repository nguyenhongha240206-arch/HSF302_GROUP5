<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside th:fragment="admin-sidebar" class="admin-sidebar shadow">
    <div class="sidebar-header d-flex align-items-center">
        <span class="fs-4 me-2">🍎</span>
        <span class="text-white fw-bold">FRUIT<span class="text-warning">ADMIN</span></span>
    </div>

    <ul class="sidebar-menu">
        <li>
            <a th:href="@{/admin}">
                <i class="bi bi-speedometer2"></i>
                <span>Bảng điều khiển</span>
            </a>
        </li>
        <li class="nav-heading text-uppercase small text-muted px-3 mt-3 mb-1 font-weight-bold">Bán Hàng & Sản Phẩm</li>
        <li>
            <a th:href="@{/admin/categories}">
                <i class="bi bi-grid-3x3-gap"></i>
                <span>Danh mục hoa quả</span>
            </a>
        </li>
        <li>
            <a th:href="@{/admin/products}">
                <i class="bi bi-box-seam"></i>
                <span>Sản phẩm & Giỏ quà</span>
            </a>
        </li>
        <li>
            <a th:href="@{/admin/orders}">
                <i class="bi bi-receipt"></i>
                <span>Quản lý đơn hàng</span>
            </a>
        </li>
        <li>
            <a th:href="@{/admin/vouchers}">
                <i class="bi bi-ticket-perforated"></i>
                <span>Voucher giảm giá</span>
            </a>
        </li>

        <li class="nav-heading text-uppercase small text-muted px-3 mt-3 mb-1 font-weight-bold">Kho & Hao Hụt</li>
        <li>
            <a th:href="@{/admin/inventory/slips}">
                <i class="bi bi-clipboard2-x"></i>
                <span>Phiếu hao hụt / Hủy</span>
            </a>
        </li>
        <li>
            <a th:href="@{/admin/inventory/stock}">
                <i class="bi bi-boxes"></i>
                <span>Kiểm kê tồn kho</span>
            </a>
        </li>

        <li sec:authorize="hasRole('ADMIN')" class="nav-heading text-uppercase small text-muted px-3 mt-3 mb-1 font-weight-bold">Hệ Thống</li>
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/users}">
                <i class="bi bi-people"></i>
                <span>Người dùng & Phân quyền</span>
            </a>
        </li>

        <li class="mt-4 pt-3 border-top border-secondary">
            <a th:href="@{/}" target="_blank" class="text-warning">
                <i class="bi bi-shop-window"></i>
                <span>Xem Cửa Hàng (FE)</span>
            </a>
        </li>
    </ul>
</aside>
</body>
</html>
