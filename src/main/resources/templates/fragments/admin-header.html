<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="admin-header" class="admin-topbar">
    <div class="d-flex align-items-center">
        <span class="text-secondary fw-semibold small">Hệ Thống Quản Trị Cửa Hàng Hoa Quả (HSF302 - Group 5)</span>
    </div>

    <div class="d-flex align-items-center gap-3">
        <div class="dropdown">
            <button class="btn btn-light btn-sm dropdown-toggle d-flex align-items-center border shadow-none" 
                    type="button" id="adminUserMenu" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle fs-5 me-2 text-success"></i>
                <span sec:authentication="name" class="fw-semibold">Admin</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-3 mt-2" aria-labelledby="adminUserMenu">
                <li><a class="dropdown-item py-2" th:href="@{/profile}"><i class="bi bi-person me-2 text-muted"></i>Hồ sơ</a></li>
                <li><a class="dropdown-item py-2" th:href="@{/}" target="_blank"><i class="bi bi-eye me-2 text-muted"></i>Xem Website</a></li>
                <li><hr class="dropdown-divider my-1"></li>
                <li>
                    <form th:action="@{/auth/logout}" method="post" class="m-0 p-0">
                        <button type="submit" class="dropdown-item text-danger py-2">
                            <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>
</body>
</html>
